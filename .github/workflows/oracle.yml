# Rebuild the decision-patched oracle after people record decisions, and commit it.
# Runs only when started by hand (Actions -> oracle -> Run workflow). It uses the same
# ubuntu-24.04 LibreOffice Calc as the committed golden data, so the verify workflow's
# recompute-and-compare check stays byte-identical.
# Author: Claude Code (AI agent) — scaffold; see ATTRIBUTION.md
name: oracle

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oracle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch:
    name: patched oracle and verify sample
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install LibreOffice Calc (the oracle)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libreoffice-calc
          soffice --version

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Decisions exist
        run: test -s decisions/decisions.jsonl || { echo "::error::decisions/decisions.jsonl is empty; record decisions with tools/decide.py first"; exit 1; }

      - name: Patched oracle and verify sample
        run: |
          make patch
          make sample

      - name: Commit the golden data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add golden/ service/sheetshift_ho3/data/verify_sample_2026.json.gz
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "Patched oracle and verify sample for decisions $(sha256sum decisions/decisions.jsonl | cut -c1-12)" \
                     -m "Built by .github/workflows/oracle.yml (make patch sample) on ubuntu-24.04 LibreOffice Calc."
          git push
