# Static GitHub Pages mirror (the fallback demo URL; see README > Running it elsewhere). A repo admin enables Pages
# with source "GitHub Actions". The pages show "API offline: showing precomputed results".
# Author: Claude Code (AI agent) — scaffold; see ATTRIBUTION.md
name: pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["public/**", "reports/**", "decisions/**", "bob_sessions/INDEX.md", "audit/**", "tools/build_site_data.py", "service/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the static site data (precomputed /verify results included when the service imports)
        run: |
          python -m pip install -r requirements.txt
          python3 -m tools.build_site_data --static

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
